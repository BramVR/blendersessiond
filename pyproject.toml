[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "blendersessiond"
version = "0.1.0"
description = "Own Blender Sessions for agent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
blendersessiond = "blendersessiond.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blendersessiond"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: CLI subprocess end-to-end tests",
    "real_blender: opt-in tests that launch an installed Blender",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/blendersessiond/vendor/addon.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
