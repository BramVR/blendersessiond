[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "blendersessiond"
version = "0.1.1"
description = "Own Blender Sessions for agent workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bram Van Rompuy" },
]
keywords = ["agents", "blender", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.scripts]
blendersessiond = "blendersessiond.cli:main"

[project.urls]
Changelog = "https://github.com/BramVR/blendersessiond/blob/main/CHANGELOG.md"
Documentation = "https://github.com/BramVR/blendersessiond#readme"
Issues = "https://github.com/BramVR/blendersessiond/issues"
Repository = "https://github.com/BramVR/blendersessiond"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blendersessiond"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "e2e: CLI subprocess end-to-end tests",
    "real_blender: opt-in tests that launch an installed Blender",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/blendersessiond/vendor/addon.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
