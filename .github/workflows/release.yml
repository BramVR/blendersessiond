name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/RELEASING.md"
      - "scripts/check_release.py"
      - "src/blendersessiond/__init__.py"
      - "tests/test_check_release.py"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify tag commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate tag and changelog
        if: github.event_name == 'push'
        run: python scripts/check_release.py "$GITHUB_REF_NAME" --output release-notes.md

      - name: Build wheel and source distribution
        run: uv build

      - name: Check package metadata
        run: uvx --from twine twine check dist/*

      - name: Smoke-test installed wheel
        run: |
          release_venv="$RUNNER_TEMP/release-venv"
          uv venv --python 3.11 "$release_venv"
          uv pip install --python "$release_venv/bin/python" --no-deps dist/*.whl
          "$release_venv/bin/python" -c \
            "import blendersessiond; print(blendersessiond.__version__)"
          "$release_venv/bin/blendersessiond" --help

      - name: Create checksums
        if: github.event_name == 'push'
        working-directory: dist
        run: sha256sum * > ../SHA256SUMS.txt

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload release metadata
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: |
            release-notes.md
            SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/blendersessiond/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  github-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release-metadata/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            release-metadata/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "blendersessiond $release_version" \
            --notes-file release-metadata/release-notes.md \
            --verify-tag
