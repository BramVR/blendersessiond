name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

      - name: Install Blender
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender

      - name: Doctor with real Blender
        if: runner.os == 'Linux'
        run: uv run blendersessiond doctor --json
